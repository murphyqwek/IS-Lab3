services:
  postgres:
    image: postgres:18-alpine3.23
    container_name: is-lab-database
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: studs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    restart: unless-stopped

  minio:
    build:
      dockerfile: src/main/java/com/example/is/minio/Dockerfile
    image: minio:local
    container_name: minio-container

    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopassword

    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: