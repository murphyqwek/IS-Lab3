server:
  port: 2721
  servlet:
    session:
      timeout: 30m

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:postgresql://localhost:5433/studs
    username: myuser
    password: mypassword
    dbcp2:
      max-total: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region.factory_class: infinispan
        generate_statistics: true
        format_sql: true
