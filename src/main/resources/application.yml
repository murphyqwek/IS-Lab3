server:
  port: 2720
  servlet:
    session:
      timeout: 30m

minio:
  endpoint: ${MINIO_URL}
  access-key: ${MINIO_USERNAME}
  secret-key: ${MINIO_PASSWORD}

spring:
    servlet:
      multipart:
        max-file-size: 1MB
        max-request-size: 2MB
    jackson:
      deserialization:
        fail-on-unknown-properties: true
    datasource:
      type: org.apache.commons.dbcp2.BasicDataSource
      url: ${POSTGRES_URL}
      username: ${POSTGRES_USERNAME}
      password: ${POSTGRES_PASSWORD}
      dbcp2:
        initial-size: 1
        max-total: 2
        min-idle: 1
        max-idle: 2
        test-on-borrow: true

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          cache:
            use_second_level_cache: true
            use_query_cache: true
            region.factory_class: infinispan
          format_sql: true
          generate_statistics: true
